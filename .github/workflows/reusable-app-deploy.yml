name: Governed application deployment

on:
  workflow_call:
    inputs:
      app_name: { type: string, required: true }
      app_url: { type: string, required: true }
      audience_group_ids: { type: string, required: true }
      azure_tenant_id: { type: string, required: true }
      azure_subscription_id: { type: string, required: true }
      azure_client_id: { type: string, required: true }
      azure_resource_group: { type: string, required: true }
      aks_cluster_name: { type: string, required: true }
      acr_name: { type: string, required: true }

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}
      - run: az acr login --name "${{ inputs.acr_name }}"
      - id: image
        env:
          IMAGE: ${{ inputs.acr_name }}.azurecr.io/${{ inputs.app_name }}:${{ github.sha }}
        run: |
          docker build --pull --tag "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ inputs.azure_resource_group }}
          cluster-name: ${{ inputs.aks_cluster_name }}
          admin: false
          use-kubelogin: true
      - name: Apply application-owned resources
        env:
          APP: ${{ inputs.app_name }}
          APP_URL: ${{ inputs.app_url }}
          AUDIENCE_GROUPS: ${{ inputs.audience_group_ids }}
          IMAGE: ${{ needs.publish.outputs.digest }}
        run: |
          envsubst < .platform/kubernetes.yaml | kubectl apply -f -
          kubectl -n "app-$APP" rollout status deployment/"$APP" --timeout=5m
